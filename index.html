<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fresh Frame — Website Design &amp; Automation Studio in Chennai</title>
  <meta name="description" content="Fresh Frame is a Chennai-based two-person studio building websites, branding and business automation. We build you a real working mock first, free — you decide after you've seen it.">
  <meta name="google-site-verification" content="vEGmWgzd6wJEZ6o_IXwX_MU4VBNey8xDl7Tx95iO_9M" />
  <link rel="canonical" href="https://freshframe.studio/">
  <!-- Resampled from the 1254px logo. The full-size file was the single
       heaviest thing on the page: every visit downloaded 1.4 MB to draw a
       34px circle in the tab. -->
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

  <!-- ══ Link previews (WhatsApp, LinkedIn, iMessage, Slack) ══
       These MUST be absolute URLs — link scrapers do not resolve relative
       paths, which is why the repo name is hardcoded here and nowhere else.
       If the repo is ever renamed or moved to a custom domain, update all
       three URLs below or previews silently stop rendering.
       og-card.jpg is the proper 1200x630 card this comment used to ask for.
       It stays a JPG on purpose: twitter:card is summary_large_image, and
       several scrapers still will not read WebP. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Fresh Frame">
  <meta property="og:title" content="Fresh Frame — We Build. You Grow.">
  <meta property="og:description" content="A two-person studio building websites, branding and custom business automation. We build you a real working mock first — you decide after you've seen it.">
  <meta property="og:url" content="https://freshframe.studio/">
  <meta property="og:image" content="https://freshframe.studio/assets/og-card.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Fresh Frame — we build, you grow. Websites, branding and automation.">
  <meta property="og:locale" content="en_IN">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Fresh Frame — We Build. You Grow.">
  <meta name="twitter:description" content="A two-person studio building websites, branding and custom business automation. We build you a real working mock first — you decide after you've seen it.">
  <meta name="twitter:image" content="https://freshframe.studio/assets/og-card.jpg">

  <!-- ══ Structured data ══
       Hardcoded here rather than generated from src/data/site.js because
       this is the static HTML shell — the one thing crawlers that don't
       execute JS (and the first pass of most that do) actually read.
       If FAQ copy or contact details change in site.js, mirror the change
       here too, or this schema drifts from what's on the page. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "ProfessionalService",
        "@id": "https://freshframe.studio/#organization",
        "name": "Fresh Frame",
        "description": "Two-person studio building websites, branding and custom business automation, based in Chennai.",
        "url": "https://freshframe.studio/",
        "logo": "https://freshframe.studio/assets/logo.webp",
        "image": "https://freshframe.studio/assets/og-card.jpg",
        "email": "freshframestud@gmail.com",
        "telephone": "+917825083996",
        "priceRange": "₹3,000–₹30,000",
        "areaServed": { "@type": "City", "name": "Chennai" },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Poonamallee",
          "addressRegion": "Tamil Nadu",
          "addressCountry": "IN"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "09:00",
          "closes": "21:00"
        },
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website design and development" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Business process automation" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Branding and visual identity" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "SEO setup, analytics and hosting" } }
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Website & automation packages",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Basic website package" }, "priceSpecification": { "@type": "PriceSpecification", "minPrice": 3000, "maxPrice": 6000, "priceCurrency": "INR" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Standard website package" }, "priceSpecification": { "@type": "PriceSpecification", "minPrice": 8000, "maxPrice": 15000, "priceCurrency": "INR" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Premium website package" }, "priceSpecification": { "@type": "PriceSpecification", "minPrice": 15000, "maxPrice": 30000, "priceCurrency": "INR" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Care plan (monthly maintenance)" }, "priceSpecification": { "@type": "PriceSpecification", "minPrice": 500, "maxPrice": 1500, "priceCurrency": "INR", "unitText": "MONTH" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Business automation" }, "priceSpecification": { "@type": "PriceSpecification", "minPrice": 15000, "maxPrice": 30000, "priceCurrency": "INR" } }
          ]
        }
      },
      {
        "@type": "Person",
        "name": "Ganesh Kumar",
        "jobTitle": "Full-Stack Developer",
        "worksFor": { "@id": "https://freshframe.studio/#organization" },
        "url": "https://ganesh-0509.github.io/",
        "sameAs": ["https://ganesh-0509.github.io/"]
      },
      {
        "@type": "Person",
        "name": "Vinothini",
        "jobTitle": "Frontend Developer",
        "worksFor": { "@id": "https://freshframe.studio/#organization" },
        "url": "https://vinothini-port.vercel.app/",
        "sameAs": ["https://vinothini-port.vercel.app/"]
      }
    ]
  }
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Is the mock really free?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes, for websites. We build you a working page based on your brief and send you the link. If you don't want to go ahead after seeing it, that's the end of it — no invoice, no obligation."
        }
      },
      {
        "@type": "Question",
        "name": "How long does the mock take?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Usually 2–3 days from the time we've understood your brief. The full build depends on scope — a single-page site is about a week, a larger site two to three."
        }
      },
      {
        "@type": "Question",
        "name": "What if I don't like the mock?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Tell us why and we'll do one more pass, or you walk away. We'd rather find out we're not a fit at this stage than three weeks in."
        }
      },
      {
        "@type": "Question",
        "name": "Do automations get a free mock too?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No — a workflow isn't something you can look at in a browser and judge in five minutes. Automations start with a call instead. We work through the features with you, then give you the scope and the price in writing before anything gets built."
        }
      },
      {
        "@type": "Question",
        "name": "What kind of automation can you actually build?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "If a person is doing it repeatedly on a computer or a phone, it can usually be automated — order and enquiry handling, invoices and quotes, daily reports, stock alerts, reminders and follow-ups."
        }
      },
      {
        "@type": "Question",
        "name": "Do I need a website to get an automation built?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. The two are separate. Plenty of businesses have a workflow worth fixing and no website at all — we're happy to do just the automation."
        }
      },
      {
        "@type": "Question",
        "name": "Do I need to buy the domain and hosting myself?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "You can, and we'll help you pick. Or we'll set it all up and hand you the logins. Either way the accounts are in your name — you own everything."
        }
      },
      {
        "@type": "Question",
        "name": "Can I update the site myself afterwards?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. We hand over a short walkthrough of how to change text, images and prices. Anything bigger, message us — or take the Care plan and we handle it."
        }
      }
    ]
  }
  </script>

  <!-- matches --paper in styles/theme.css -->
  <meta name="theme-color" content="#0b0b0d">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Anton = the heavy poster display face. Caveat = the handwritten
       asides. Both are single-weight, so no weight axis is requested. -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
