# ══════════════════════════════════════════════════════════
# Build the React site and publish it to GitHub Pages.
#
# Runs on every push to main. Nothing to do manually after the
# one-time setup in DEPLOY.md (Settings → Pages → Source: GitHub Actions).
# ══════════════════════════════════════════════════════════
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # lets you re-run a deploy from the Actions tab without pushing
  workflow_dispatch:

# Required for the deploy step to authenticate to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer build win rather than
# queueing a deploy of already-stale code.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # There is a lockfile now that the app lives at the root, so `npm ci`
      # gives a reproducible install.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Tells Bing/Yandex/Naver about every URL on every deploy instead of
      # waiting for their own crawl schedule to notice something changed.
      # Best-effort: a failure here shouldn't fail the deploy, since the
      # site is already live by this point.
      - name: Submit sitemap to IndexNow
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{
              "host": "freshframe.studio",
              "key": "c0d439439caeafa5355177672b478ada",
              "keyLocation": "https://freshframe.studio/c0d439439caeafa5355177672b478ada.txt",
              "urlList": [
                "https://freshframe.studio/",
                "https://freshframe.studio/web-design.html",
                "https://freshframe.studio/automation.html",
                "https://freshframe.studio/about.html",
                "https://freshframe.studio/contact.html",
                "https://freshframe.studio/terms.html",
                "https://freshframe.studio/privacy.html",
                "https://freshframe.studio/refund-policy.html"
              ]
            }'
