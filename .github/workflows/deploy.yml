# ══════════════════════════════════════════════════════════
# Build the React site and publish it to GitHub Pages.
#
# Runs on every push to main. Nothing to do manually after the
# one-time setup in DEPLOY.md (Settings → Pages → Source: GitHub Actions,
# and adding the VITE_WEB3FORMS_KEY secret).
# ══════════════════════════════════════════════════════════
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # lets you re-run a deploy from the Actions tab without pushing
  workflow_dispatch:

# Required for the deploy step to authenticate to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer build win rather than
# queueing a deploy of already-stale code.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # There is a lockfile now that the app lives at the root, so `npm ci`
      # gives a reproducible install.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        # Vite inlines VITE_* vars at BUILD time, so the key has to be
        # present here — setting it anywhere later has no effect.
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
        run: |
          if [ -z "$VITE_WEB3FORMS_KEY" ]; then
            echo "::warning title=Contact form disabled::VITE_WEB3FORMS_KEY secret is not set. The site will build, but the contact form will show its fallback message instead of sending. Add it under Settings → Secrets and variables → Actions."
          fi
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
